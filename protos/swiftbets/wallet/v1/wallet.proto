syntax = "proto3";

package swiftbets.wallet.v1;

option csharp_namespace = "SwiftBets.Contracts.Grpc.Wallet.V1";

// Every mutating call is idempotent on idempotency_key: a repeat returns the original outcome with was_applied = false.
service Wallet {
  rpc Reserve (ReserveRequest) returns (ReservationReply);
  rpc Capture (ReservationCommand) returns (ReservationReply);
  rpc Release (ReservationCommand) returns (ReservationReply);
  rpc Credit (PostingRequest) returns (PostingReply);
  rpc Debit (PostingRequest) returns (PostingReply);
  rpc GetBalance (GetBalanceRequest) returns (BalanceReply);
  rpc GetReservation (GetReservationRequest) returns (ReservationReply);
  // A provider-confirmed deposit from the funding account, judged against deposit limits and restrictions.
  rpc Deposit (PostingRequest) returns (PostingReply);
  // Holds a withdrawal's amount; refused with ACCOUNT_RESTRICTED while withdrawals are blocked.
  rpc HoldWithdrawal (ReserveRequest) returns (ReservationReply);
  // Pays a held withdrawal out to the funding account. A failed or rejected withdrawal uses Release.
  rpc CompleteWithdrawal (ReservationCommand) returns (ReservationReply);
  // The customer's account in a currency, opened empty if it does not exist yet.
  rpc OpenAccount (OpenAccountRequest) returns (BalanceReply);
  rpc ListAccounts (ListAccountsRequest) returns (AccountsReply);
}

message Money {
  int64 minor_units = 1;
  string currency = 2;
}

message Balance {
  string account_id = 1;
  Money available = 2;
  Money reserved = 3;
  // Bonus money: stakeable but not withdrawable.
  Money bonus = 4;
  string user_id = 5;
}

enum ReservationState {
  RESERVATION_STATE_UNSPECIFIED = 0;
  RESERVATION_STATE_HELD = 1;
  RESERVATION_STATE_CAPTURED = 2;
  RESERVATION_STATE_RELEASED = 3;
}

enum WalletFailureCode {
  WALLET_FAILURE_CODE_UNSPECIFIED = 0;
  WALLET_FAILURE_CODE_INSUFFICIENT_FUNDS = 1;
  WALLET_FAILURE_CODE_ACCOUNT_NOT_FOUND = 2;
  WALLET_FAILURE_CODE_ACCOUNT_BLACKLISTED = 3;
  WALLET_FAILURE_CODE_RESERVATION_NOT_FOUND = 4;
  WALLET_FAILURE_CODE_INVALID_STATE = 5;
  WALLET_FAILURE_CODE_CURRENCY_MISMATCH = 6;
  WALLET_FAILURE_CODE_IDEMPOTENCY_CONFLICT = 7;
  // A responsible-gambling limit (stake, loss or deposit) would be exceeded; the message says which and what is left.
  WALLET_FAILURE_CODE_LIMIT_EXCEEDED = 8;
  // The account is excluded or blocked from this kind of movement (betting or deposits).
  WALLET_FAILURE_CODE_ACCOUNT_RESTRICTED = 9;
}

message WalletFailure {
  WalletFailureCode code = 1;
  string message = 2;
}

message ReserveRequest {
  string idempotency_key = 1;
  string account_id = 2;
  Money amount = 3;
  string reference = 4;
  // What the stake is on, "sport" or "casino"; bonus money is only used where its offer allows (cash is used first).
  string product = 5;
  // The lowest price on the coupon in hundredths (150 = 1.50); bonus money and free bets need their minimum odds.
  int32 odds_hundredths = 6;
  // Stake a free bet instead of the customer's money; the amount must equal the free bet's value.
  string free_bet_id = 7;
}

message ReservationCommand {
  string idempotency_key = 1;
  string reservation_id = 2;
}

message Reservation {
  string reservation_id = 1;
  string account_id = 2;
  Money amount = 3;
  ReservationState state = 4;
  string reference = 5;
  // The part of the stake drawn from bonus money; the rest is cash unless free_bet_id is set.
  Money bonus_amount = 6;
  string free_bet_id = 7;
}

message ReservationReply {
  bool was_applied = 1;
  oneof outcome {
    Reservation reservation = 2;
    WalletFailure failure = 3;
  }
}

message PostingRequest {
  string idempotency_key = 1;
  string account_id = 2;
  Money amount = 3;
  string reference = 4;
  string reason = 5;
}

message Posting {
  string posting_id = 1;
  Balance balance = 2;
}

message PostingReply {
  bool was_applied = 1;
  oneof outcome {
    Posting posting = 2;
    WalletFailure failure = 3;
  }
}

message GetBalanceRequest {
  string account_id = 1;
}

message BalanceReply {
  oneof outcome {
    Balance balance = 1;
    WalletFailure failure = 2;
  }
}

message GetReservationRequest {
  string reservation_id = 1;
  string idempotency_key = 2;
}

message OpenAccountRequest {
  string user_id = 1;
  string currency = 2;
}

message ListAccountsRequest {
  string user_id = 1;
}

message AccountsReply {
  repeated Balance accounts = 1;
}
