name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release this commit as v<version> (for example 0.5.0)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -qE '^\s+> ' vulnerable.txt

  release:
    # A release cut from a feature branch drops whatever main merged since it branched (2.11.0 shipped without 2.6.0),
    # so a manual release runs only on main.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.version != '' && github.ref == 'refs/heads/main')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - env:
          VERSION: ${{ inputs.version }}
        run: dotnet pack -c Release -o artifacts -p:Version="${VERSION:-${GITHUB_REF_NAME#v}}"
      # A dispatched release creates its tag on the built commit; a pushed tag already has one.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION:-${GITHUB_REF_NAME#v}}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          gh release upload "$tag" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ts/.nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then npm version "$VERSION" --no-git-tag-version --allow-same-version
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version; fi
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ts/*.tgz

  npm-release:
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.version != '' && github.ref == 'refs/heads/main')
    needs: [release, typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v${VERSION:-${GITHUB_REF_NAME#v}}" ./*.tgz --repo "$GITHUB_REPOSITORY" --clobber
